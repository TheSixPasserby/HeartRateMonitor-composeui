name: Build Beta APK

# 推送到 beta 分支自动触发：先跑单测基线（串行，契约 07），再出带 -beta.N 后缀的签名 APK，
# 发布为 GitHub prerelease（应用内更新检查会跳过 prerelease，不打扰正式用户）。
on:
  push:
    branches: [beta]

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: chmod gradlew
        run: chmod +x gradlew

      # --max-workers=1 为硬性要求（多模块 Robolectric 共用 settingsDataStore 文件，
      # 并行会产生环境性假失败）；--continue 保证一次跑完所有模块暴露全部失败。
      # continue-on-error：CI 慢机器上存在环境性 flaky（对照实验证实纯上游代码同样失败，
      # 见 skill/docs/baseline/current.md「CI 环境已知 flaky」），单测结果仅供参考不拦出包；
      # 编译错误仍会在 assembleRelease 阶段拦截。
      - name: Unit tests (serial baseline, non-blocking)
        id: tests
        continue-on-error: true
        run: >
          ./gradlew --max-workers=1 --continue
          :app:testDebugUnitTest
          :service:testDebugUnitTest
          :data:database:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:repository:testDebugUnitTest
          :core:designsystem:testDebugUnitTest
          :core:ui:testDebugUnitTest
          :core:model:testDebugUnitTest
          :feature:alarm:testDebugUnitTest
          :feature:server:testDebugUnitTest
          :feature:settings:testDebugUnitTest

      - name: Test result summary
        run: |
          {
            if [ "${{ steps.tests.outcome }}" = "failure" ]; then
              echo "## ⚠️ 单测有失败（非阻塞，需人工核对是否为已知 CI flaky）"
              echo '```'
              python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for f in glob.glob('**/test-results/testDebugUnitTest/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      print(f"{tc.get('classname')} > {tc.get('name')}")
          PY
              echo '```'
              echo "已知 CI flaky 清单见 android/skill/docs/baseline/current.md"
            else
              echo "## ✅ 单测全部通过"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p .key
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret 未设置（Settings → Secrets and variables → Actions 补配 4 个密钥）" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .key/app-release.jks

      - name: Read base version
        id: ver
        run: |
          base=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$base" ]; then
            echo "ERROR: 无法从 app/build.gradle.kts 解析 versionName" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "beta version: v$base-beta.$GITHUB_RUN_NUMBER"

      - name: Build beta release
        run: ./gradlew assembleRelease
        env:
          VERSION_SUFFIX: -beta.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK to Prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.base }}-beta.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
